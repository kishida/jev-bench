<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maze live</title>
<style>
  :root { --bg:#f7f7f5; --panel:#fff; --text:#1d1d1b; --muted:#6b6b66; --border:#e2e1dc; --accent:#2f6fdb;
          --soft:#dbe6fa; --me:#285ac8; --goal:#1e9646; --wall:#191919; --floor:#f8f8f5; --trail:#d7e1f0;
          --danger:#b3261e; --ok:#2e7d32; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161615; --panel:#1f1f1d; --text:#ecebe6; --muted:#9a9993;
          --border:#34332f; --accent:#7aa7f5; --soft:#24324b; --floor:#26261f; --trail:#33425c;
          --wall:#0c0c0c; --danger:#f28b82; --ok:#81c995; } }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:15px/1.6 system-ui,-apple-system,"Segoe UI","Hiragino Sans",sans-serif; }
  main { max-width:1080px; margin:0 auto; padding:22px 16px 50px; }
  .head { display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; }
  h1 { font-size:20px; margin:0; }
  .sub { color:var(--muted); font-size:14px; }
  .tag { font-family:var(--mono); font-size:12px; padding:2px 8px; border-radius:10px;
         background:var(--soft); color:var(--accent); }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--ok); margin-right:6px; }
  .dot.off { background:var(--danger); }
  section { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:16px; margin-top:14px; }
  h2 { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 10px; }
  .stage { display:grid; grid-template-columns:minmax(0,1fr) 290px; gap:14px; align-items:start; }
  .stage > section { margin-top:0; }
  canvas { width:100%; height:auto; display:block; border-radius:6px; }
  .stagewrap { position:relative; }
  .over { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
          justify-content:center; gap:6px; border-radius:6px; background:rgba(20,20,20,.62); color:#fff;
          text-align:center; }
  .over b { font-size:22px; font-weight:600; }
  .over span { font-size:14px; opacity:.85; }
  .bar-row { margin-bottom:9px; }
  .bar-top { display:flex; justify-content:space-between; font-size:13px; }
  .bar-track { height:12px; background:var(--soft); border-radius:4px; overflow:hidden; }
  .bar-fill { display:block; height:100%; background:#9db8e8; transition:width .12s linear; }
  .chosen .bar-fill { background:var(--accent); }
  .chosen .bar-top { font-weight:600; }
  .wall .bar-top b::after { content:" ×"; color:var(--danger); }
  .meta { font-family:var(--mono); font-size:12px; color:var(--muted); }
  .big { display:flex; gap:22px; flex-wrap:wrap; margin-bottom:10px; }
  .big div { min-width:74px; }
  .big b { display:block; font-size:22px; font-family:var(--mono); line-height:1.2; }
  .big span { font-size:12px; color:var(--muted); }
  .dead { color:var(--danger); font-weight:600; }
  .ok { color:var(--ok); font-weight:600; }
  .legend { display:flex; gap:14px; flex-wrap:wrap; font-size:13px; color:var(--muted); margin-top:8px; }
  .sw { display:inline-block; width:12px; height:12px; border-radius:2px; vertical-align:-1px; margin-right:4px; }
  ul.log { list-style:none; margin:0; padding:0; font-family:var(--mono); font-size:12px; max-height:150px; overflow:auto; }
  ul.log li { padding:2px 0; border-bottom:1px solid var(--border); color:var(--muted); }
  @media (max-width:820px) { .stage { grid-template-columns:1fr; } }
</style>
</head>
<body>
<main>
  <div class="head">
    <h1>Maze live</h1>
    <div class="sub"><span class="dot" id="dot"></span><span id="conn">接続中…</span>
      &nbsp;<span class="tag" id="model">-</span> <span class="tag" id="mode">-</span></div>
  </div>
  <p class="sub">一手ごとに <code>/v1/systemone</code> へ「上下左右どれ？」と聞いて進めています。右の棒グラフがそのときの確率、× は壁にぶつかる方向です。</p>

  <div class="stage">
    <section>
      <h2>迷路</h2>
      <div class="stagewrap"><canvas id="board" width="520" height="520"></canvas><div class="over" id="overlay" hidden></div></div>
      <div class="legend">
        <span><span class="sw" style="background:var(--me)"></span>現在地</span>
        <span><span class="sw" style="background:var(--goal)"></span>ゴール</span>
        <span><span class="sw" style="background:var(--wall)"></span>壁</span>
        <span><span class="sw" style="background:var(--trail)"></span>通った跡</span>
        <span id="status"></span>
      </div>
    </section>

    <section>
      <h2>モデルの判断</h2>
      <div id="bars"></div>
      <div class="meta" id="pick"></div>
    </section>
  </div>

  <section>
    <h2>これまで</h2>
    <div class="big">
      <div><b id="s-rem">-</b><span>ゴールまで</span></div>
      <div><b id="s-solved">0</b><span>到達</span></div>
      <div><b id="s-games">0</b><span>迷路の数</span></div>
      <div><b id="s-legal">-</b><span>壁でない手</span></div>
      <div><b id="s-closer">-</b><span>近づく手</span></div>
      <div><b id="s-ms">-</b><span>1手</span></div>
    </div>
    <ul class="log" id="log"></ul>
  </section>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const DIRS = ["up", "down", "left", "right"];
const CAUSE = {goal: "ゴールに到達", stuck: "壁にぶつかり続けて打ち切り",
  "step limit": "手数の上限に達した"};

function draw(f, over) {
  const grid = f.grid.map((r) => r.split(""));
  const h = grid.length, w = grid[0].length;
  const cv = $("board"), ctx = cv.getContext("2d");
  const cell = Math.floor(cv.width / w);
  const css = getComputedStyle(document.documentElement), c = (n) => css.getPropertyValue(n).trim();
  ctx.clearRect(0, 0, cv.width, cv.height);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      ctx.fillStyle = grid[y][x] === "#" ? c("--wall") : c("--floor");
      ctx.fillRect(x * cell, y * cell, cell, cell);
    }
  }
  const box = (x, y, col, pad) => { ctx.fillStyle = col; ctx.fillRect(x * cell + pad, y * cell + pad, cell - 2 * pad, cell - 2 * pad); };
  for (const [x, y] of f.trail) box(x, y, c("--trail"), Math.floor(cell / 3));
  box(f.goal[0], f.goal[1], c("--goal"), 3);
  box(f.pos[0], f.pos[1], over && f.cause !== "goal" ? c("--danger") : c("--me"), 3);
}

function render(f) {
  const over = f.type === "over";
  draw(f, over);
  const ov = $("overlay");
  ov.hidden = !over;
  if (over) {
    ov.innerHTML = `<b>${CAUSE[f.cause] || f.cause}</b>`
      + `<span>${f.steps} 手 / 最短 ${f.shortest} 手 / 壁に ${f.bumps} 回 / ${f.seconds} 秒</span>`
      + `<span>まもなく次の迷路が始まります</span>`;
  }
  $("model").textContent = f.model;
  $("mode").textContent = f.mode === "image" ? "画像" : (f.labels ? "番号+座標" : "AA");
  $("status").innerHTML = `迷路 ${f.game} / ${f.steps} 手（最短 ${f.shortest}）`
    + (over ? (f.cause === "goal" ? ' <span class="ok">ゴール</span>'
                                  : ` <span class="dead">${CAUSE[f.cause] || f.cause}</span>`) : "");

  const bars = $("bars");
  if (!bars.children.length) {
    bars.innerHTML = DIRS.map((d) => `<div class="bar-row" data-d="${d}">`
      + `<div class="bar-top"><b>${d}</b><span>0%</span></div>`
      + `<div class="bar-track"><span class="bar-fill" style="width:0%"></span></div></div>`).join("");
  }
  for (const d of DIRS) {
    const row = bars.querySelector(`[data-d="${d}"]`);
    const p = (f.probs && f.probs[d]) || 0;
    row.querySelector("span").textContent = `${(p * 100).toFixed(1)}%`;
    row.querySelector(".bar-fill").style.width = `${(p * 100).toFixed(1)}%`;
    row.classList.toggle("chosen", d === f.choice);
    row.classList.toggle("wall", !!(f.legal && f.legal.length && !f.legal.includes(d)));
  }
  $("pick").textContent = over ? `${f.seconds} 秒で終了`
    : `選んだ手: ${f.choice}${f.legal && f.legal.length ? (f.legal.includes(f.choice) ? "" : "（壁）") : ""}`
      + ` / confidence ${(f.confidence || 0).toFixed(3)} / ${f.ms} ms`;

  const s = f.stats || {};
  $("s-rem").textContent = f.remaining ?? "-";
  $("s-solved").textContent = `${s.solved ?? 0}/${s.games ?? 0}`;
  $("s-games").textContent = s.games ?? 0;
  if (s.moves) {
    $("s-legal").textContent = `${(100 * s.legal / s.moves).toFixed(0)}%`;
    $("s-closer").textContent = `${(100 * s.closer / s.moves).toFixed(0)}%`;
  }
  if (f.ms) $("s-ms").textContent = `${f.ms} ms`;

  if (over) {
    const li = document.createElement("li");
    li.textContent = `maze ${f.game}: ${f.cause}, ${f.steps} 手（最短 ${f.shortest}）, 壁 ${f.bumps} 回`;
    $("log").prepend(li);
    while ($("log").children.length > 50) $("log").lastChild.remove();
  }
}

function connect() {
  const es = new EventSource("events");
  es.onopen = () => { $("conn").textContent = "接続中"; $("dot").classList.remove("off"); };
  es.onerror = () => { $("conn").textContent = "切断 — 再接続します"; $("dot").classList.add("off"); };
  es.onmessage = (e) => {
    const f = JSON.parse(e.data);
    if (f.type === "error") { $("conn").textContent = "モデルサーバーの応答なし"; $("dot").classList.add("off"); return; }
    $("conn").textContent = "接続中"; $("dot").classList.remove("off");
    render(f);
  };
}
connect();
</script>
</body>
</html>
