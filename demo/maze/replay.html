<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maze replay</title>
<style>
  :root { --bg:#f7f7f5; --panel:#fff; --text:#1d1d1b; --muted:#6b6b66; --border:#e2e1dc; --accent:#2f6fdb;
          --soft:#dbe6fa; --me:#285ac8; --goal:#1e9646; --wall:#191919; --floor:#f8f8f5; --trail:#d7e1f0;
          --danger:#b3261e; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161615; --panel:#1f1f1d; --text:#ecebe6; --muted:#9a9993;
          --border:#34332f; --accent:#7aa7f5; --soft:#24324b; --floor:#26261f; --trail:#33425c;
          --wall:#0c0c0c; --danger:#f28b82; } }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:15px/1.6 system-ui,-apple-system,"Segoe UI","Hiragino Sans",sans-serif; }
  main { max-width:1100px; margin:0 auto; padding:24px 16px 60px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .lead { color:var(--muted); margin:0 0 20px; }
  section { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:16px; margin-bottom:14px; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 10px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  select, input[type=file], button { font:inherit; padding:6px 10px; border:1px solid var(--border);
          border-radius:6px; background:var(--bg); color:var(--text); }
  button { background:var(--accent); border-color:var(--accent); color:#fff; cursor:pointer; }
  button.ghost { background:transparent; color:var(--accent); }
  .stage { display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:16px; align-items:start; }
  .stage > section { margin-bottom:0; }
  canvas { width:100%; height:auto; display:block; border-radius:6px; }
  input[type=range] { width:100%; }
  table { border-collapse:collapse; width:100%; font-size:14px; }
  th, td { text-align:left; padding:4px 8px; border-bottom:1px solid var(--border); }
  th { color:var(--muted); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.05em; }
  td.num, th.num { text-align:right; font-family:var(--mono); }
  .bar-row { margin-bottom:8px; }
  .bar-top { display:flex; justify-content:space-between; font-size:13px; }
  .bar-track { height:12px; background:var(--soft); border-radius:4px; overflow:hidden; }
  .bar-fill { display:block; height:100%; background:#9db8e8; }
  .chosen .bar-fill { background:var(--accent); }
  .chosen .bar-top { font-weight:600; }
  .wall .bar-top b::after { content:" ×"; color:var(--danger); }
  .meta { font-family:var(--mono); font-size:12px; color:var(--muted); margin-top:8px; }
  .dead { color:var(--danger); font-weight:600; }
  .ok { color:var(--goal); font-weight:600; }
  .legend { display:flex; gap:14px; flex-wrap:wrap; font-size:13px; color:var(--muted); margin-top:8px; }
  .sw { display:inline-block; width:12px; height:12px; border-radius:2px; vertical-align:-1px; margin-right:4px; }
  @media (max-width:820px) { .stage { grid-template-columns:1fr; } }
</style>
</head>
<body>
<main>
  <h1>Maze replay</h1>
  <p class="lead">迷路を <code>/v1/systemone</code> に一手ずつ「上下左右どれ？」と聞いて解かせた記録を再生します。棒グラフはそのときの確率、× は壁にぶつかる方向です。</p>

  <section>
    <div class="row">
      <input type="file" id="file" accept=".json" multiple>
      <select id="run"></select>
      <select id="game"></select>
      <button id="play">▶ 再生</button>
      <button class="ghost" id="prev">◀</button>
      <button class="ghost" id="next">▶</button>
      <select id="speed">
        <option value="500">0.5秒/手</option>
        <option value="250" selected>0.25秒/手</option>
        <option value="100">0.1秒/手</option>
      </select>
    </div>
    <div class="row" style="margin-top:10px"><input type="range" id="slider" min="0" value="0"></div>
  </section>

  <div class="stage">
    <section>
      <h2>迷路</h2>
      <canvas id="board" width="520" height="520"></canvas>
      <div class="legend">
        <span><span class="sw" style="background:var(--me)"></span>現在地</span>
        <span><span class="sw" style="background:var(--goal)"></span>ゴール</span>
        <span><span class="sw" style="background:var(--wall)"></span>壁</span>
        <span><span class="sw" style="background:var(--trail)"></span>通った跡</span>
      </div>
      <div class="meta" id="status"></div>
    </section>

    <section>
      <h2>モデルの判断</h2>
      <div id="bars"></div>
      <div class="meta" id="pick"></div>
    </section>
  </div>

  <section>
    <h2>まとめ</h2>
    <div id="summary"></div>
  </section>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const DIRS = ["up", "down", "left", "right"];
const runs = new Map();
let cur = null, gi = 0, fi = 0, timer = null;

async function addFiles(files) {
  for (const f of files) {
    try {
      const data = JSON.parse(await f.text());
      if (data.games) runs.set(f.name.replace(/\.json$/, ""), data);
    } catch (e) { console.error(f.name, e); }
  }
  fillRuns();
  renderSummary();
}

function fillRuns() {
  $("run").innerHTML = "";
  for (const name of runs.keys()) {
    const o = document.createElement("option");
    o.value = o.textContent = name;
    $("run").append(o);
  }
  if (runs.size) selectRun($("run").value);
}

function selectRun(name) {
  cur = runs.get(name);
  if (!cur) return;
  $("game").innerHTML = "";
  cur.games.forEach((g, i) => {
    const o = document.createElement("option");
    o.value = i;
    o.textContent = `game ${i} — ${g.solved ? "solved" : "failed"}, ${g.steps} 手 (最短 ${g.shortest})`;
    $("game").append(o);
  });
  selectGame(0);
}

function selectGame(i) {
  gi = Number(i);
  fi = 0;
  $("slider").max = cur.games[gi].frames.length - 1;
  $("slider").value = 0;
  draw();
}

function draw() {
  const g = cur.games[gi], f = g.frames[fi];
  const grid = g.grid.map((r) => r.split(""));
  const h = grid.length, w = grid[0].length;
  const cv = $("board"), ctx = cv.getContext("2d");
  const cell = Math.floor(cv.width / w);
  const css = getComputedStyle(document.documentElement), c = (n) => css.getPropertyValue(n).trim();
  ctx.clearRect(0, 0, cv.width, cv.height);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      ctx.fillStyle = grid[y][x] === "#" ? c("--wall") : c("--floor");
      ctx.fillRect(x * cell, y * cell, cell, cell);
    }
  }
  const box = (x, y, col, pad) => { ctx.fillStyle = col; ctx.fillRect(x * cell + pad, y * cell + pad, cell - 2 * pad, cell - 2 * pad); };
  for (let k = 0; k <= fi; k++) {
    const p = g.frames[k].pos;
    box(p[0], p[1], c("--trail"), Math.floor(cell / 3));
  }
  box(g.goal[0], g.goal[1], c("--goal"), 3);
  box(f.pos[0], f.pos[1], c("--me"), 3);

  const last = fi === g.frames.length - 1;
  $("status").innerHTML = `手 ${f.steps} / ゴールまで ${f.remaining ?? "-"}`
    + (last ? (g.solved ? ' <span class="ok">ゴール</span>'
                        : ` <span class="dead">手数切れ（${g.steps} 手、最短 ${g.shortest}）</span>`) : "");

  const bars = $("bars");
  bars.innerHTML = "";
  const probs = f.probs || {};
  if (!Object.keys(probs).length) {
    bars.innerHTML = '<p class="meta">この実行には確率がありません（optimal / random）。</p>';
  } else {
    for (const d of DIRS) {
      const p = probs[d] ?? 0;
      const row = document.createElement("div");
      row.className = "bar-row" + (d === f.choice ? " chosen" : "")
        + (f.legal && f.legal.length && !f.legal.includes(d) ? " wall" : "");
      row.innerHTML = `<div class="bar-top"><b>${d}</b><span>${(p * 100).toFixed(1)}%</span></div>`
        + `<div class="bar-track"><span class="bar-fill" style="width:${(p * 100).toFixed(1)}%"></span></div>`;
      bars.append(row);
    }
  }
  $("pick").textContent = last ? "" :
    `選んだ手: ${f.choice}` + (f.moved ? (f.closer ? "（進んだ・近づいた）" : "（進んだ）") : "（壁にぶつかった）")
    + (f.confidence ? ` / confidence ${f.confidence.toFixed(3)}` : "");
  $("slider").value = fi;
  $("game").value = gi;
}

function renderSummary() {
  const rows = [...runs.entries()].map(([name, d]) => {
    const s = d.summary;
    return `<tr><td>${name}</td><td>${s.mode}</td><td class="num">${(s.solve_rate * 100).toFixed(0)}%</td>`
      + `<td class="num">${s.mean_ratio ? s.mean_ratio.toFixed(2) : "-"}</td>`
      + `<td class="num">${(s.legal_rate * 100).toFixed(1)}%</td>`
      + `<td class="num">${(s.closer_rate * 100).toFixed(1)}%</td>`
      + `<td class="num">${s.bumps_per_game.toFixed(1)}</td>`
      + `<td class="num">${s.mean_ms_per_move ? s.mean_ms_per_move.toFixed(0) + " ms" : "-"}</td></tr>`;
  }).join("");
  $("summary").innerHTML = rows
    ? `<table><thead><tr><th>実行</th><th>入力</th><th class="num">到達率</th><th class="num">遠回り</th>`
      + `<th class="num">壁でない手</th><th class="num">近づく手</th><th class="num">衝突/局</th>`
      + `<th class="num">1手</th></tr></thead><tbody>${rows}</tbody></table>`
    : '<p class="meta">JSON を読み込むとここに出ます。</p>';
}

function step(d) {
  fi = Math.min(Math.max(0, fi + d), cur.games[gi].frames.length - 1);
  draw();
}

$("file").addEventListener("change", (e) => addFiles(e.target.files));
$("run").addEventListener("change", (e) => selectRun(e.target.value));
$("game").addEventListener("change", (e) => selectGame(e.target.value));
$("slider").addEventListener("input", (e) => { fi = +e.target.value; draw(); });
$("prev").addEventListener("click", () => step(-1));
$("next").addEventListener("click", () => step(1));
$("play").addEventListener("click", () => {
  if (timer) { clearInterval(timer); timer = null; $("play").textContent = "▶ 再生"; return; }
  $("play").textContent = "⏸ 停止";
  timer = setInterval(() => {
    if (fi >= cur.games[gi].frames.length - 1) { clearInterval(timer); timer = null; $("play").textContent = "▶ 再生"; return; }
    step(1);
  }, +$("speed").value);
});
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowLeft") step(-1);
  if (e.key === "ArrowRight") step(1);
});

(async () => {
  try {
    const idx = await (await fetch("../../results/maze/index.json")).json();
    for (const e of idx) {
      const r = await fetch(`../../results/maze/${e.tag}.json`);
      if (r.ok) runs.set(e.label || e.tag, await r.json());
    }
  } catch {}
  if (runs.size) fillRuns();
  renderSummary();
})();
</script>
</body>
</html>
